groups:
  - name: flux2
    rules:
      - alert: Flux2ScrapeDown
        expr: up{job="flux2"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'FLUX.2 metrics scrape is down on {{ $labels.instance }}'
          description: 'Check the Pod, metrics port, proxy and dedicated scrape credential.'
      - alert: Flux2ModelNotReady
        expr: (flux2_model_ready{job="flux2"} == 0) and on(instance) (up{job="flux2"} == 1)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'FLUX.2 model remains unready on {{ $labels.instance }}'
          description: 'Inspect loading, BF16/device validation and worker health. Do not enable offloading as a fallback.'
      - alert: Flux2GpuCollectorDown
        expr: (gpu_exporter_up{job="flux2"} == 0) and on(instance) (up{job="flux2"} == 1)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'FLUX.2 GPU collection failed on {{ $labels.instance }}'
          description: 'Check nvidia-smi and GPU visibility; service reachability alone does not prove GPU health.'
      - alert: Flux2RequiredMetricsMissing
        expr: ((up{job="flux2"} == 1) unless on(job,instance) (flux2_model_ready{job="flux2"} and on(job,instance) gpu_exporter_up{job="flux2"} and on(job,instance) flux2_oom_total{job="flux2"})) or absent(up{job="flux2"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'FLUX.2 required monitoring data is missing'
          description: 'The configured image scrape has no up series, or a reachable exporter omitted model readiness, GPU collector health or the OOM counter. Check the target and exporter contract.'
      - alert: Flux2OutOfMemory
        expr: (increase(flux2_oom_total{job="flux2"}[10m]) > 0) or ((flux2_oom_total{job="flux2"} > 0) unless on(job,instance) (flux2_oom_total{job="flux2"} offset 10m))
        labels:
          severity: critical
        annotations:
          summary: 'FLUX.2 encountered GPU out-of-memory on {{ $labels.instance }}'
          description: 'An OOM occurred during model loading, warmup or generation. Inspect GPU allocation and the failed operation before admitting more work; do not enable quantization or offloading.'
      - alert: Flux2GenerationFailures
        expr: sum by(job,instance) (increase(flux2_jobs_failed_total{job="flux2",reason=~"generation_error|timeout|interrupted|oom"}[10m])) >= 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'FLUX.2 generation failures increased on {{ $labels.instance }}'
          description: 'At least three worker errors, OOMs, timeouts or interrupted jobs occurred in ten minutes.'
      - alert: Flux2DiskLow
        expr: flux2_disk_available_bytes{job="flux2"} < 10737418240
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'FLUX.2 output disk has less than 10 GiB available on {{ $labels.instance }}'
          description: 'Check retention cleanup and output filesystem capacity.'
      - alert: Flux2DiskCritical
        expr: flux2_disk_available_bytes{job="flux2"} < 3221225472
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'FLUX.2 output disk has less than 3 GiB available on {{ $labels.instance }}'
          description: 'Restore disk headroom before accepting additional work.'
