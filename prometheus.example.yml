global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/flux2-alerts.yml
scrape_configs:
  - job_name: vllm
    scheme: https
    scrape_timeout: 12s
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets:
          - "4bit-pod-8889.proxy.runpod.net"
        labels:
          profile: "4bit"
      - targets:
          - "bf16-pod-8889.proxy.runpod.net"
        labels:
          profile: "bf16"
  # Optional image backend; uses a separate bearer credential file.
  - job_name: flux2
    scheme: https
    scrape_timeout: 12s
    authorization:
      type: Bearer
      credentials_file: /tmp/flux2-metrics-token
    static_configs:
      - targets:
          - "image-pod-8889.proxy.runpod.net"
