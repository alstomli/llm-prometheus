global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/flux2-alerts.yml
scrape_configs:
  - job_name: vllm
    scheme: https
    scrape_timeout: 12s
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets:
          - "rp93m3noz3l9lt-8888.proxy.runpod.net"
          - "ftntkktzid9f4p-8889.proxy.runpod.net"
  # Optional image backend; uses a separate bearer credential file.
  - job_name: flux2
    scheme: https
    scrape_timeout: 12s
    authorization:
      type: Bearer
      credentials_file: /tmp/flux2-metrics-token
    static_configs:
      - targets:
          - "image-pod-8889.proxy.runpod.net"
